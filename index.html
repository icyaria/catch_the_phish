<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Προσομοίωση Email Server</title>
  <link rel="icon" href="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="logo">📨 MailSim</div>
    <div class="search-bar">
      <input type="text" placeholder="Αναζήτηση στο inbox...">
    </div>
    <div class="icons">
      <div class="icon">⚙</div>
      <div class="icon">❓</div>
      <div class="icon">👤</div>
    </div>
  </header>

  <div class="container">
    <div id="emailList" class="email-list"></div>
    <div id="emailView" class="email-view"></div>
    <div class="progress" id="progress"></div>
    <button id="nextLevelBtn" onclick="nextLevel()">➡️ Επόμενη Πίστα</button>
  </div>
</body>
</html>
