<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Προσομοίωση Email Server</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #eaf1fb;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .search-bar input {
      padding: 8px 12px;
      width: 300px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
    }

    .icons {
      display: flex;
      gap: 12px;
    }

    .icon {
      width: 32px;
      height: 32px;
      background: white;
      color: #1a73e8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 20px;
    }

    .email-list {
      border-top: 1px solid #ddd;
    }

    .email-item {
      border-bottom: 1px solid #eee;
      padding: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .email-item:hover {
      background: #f5f8fd;
    }

    .email-item strong {
      display: block;
      font-size: 16px;
      color: #202124;
    }

    .email-item span {
      color: #5f6368;
      font-size: 13px;
    }

    .email-view {
      display: none;
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
    }

    .email-view.active {
      display: block;
    }

    .email-view h3 {
      margin: 0;
      color: #1a73e8;
    }

    .email-view p {
      font-size: 15px;
      color: #202124;
    }

    .spam-btn {
      margin-top: 15px;
      background: #d93025;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .spam-btn:hover {
      background: #b1271b;
    }

    .spam-btn:disabled {
      background: gray;
      cursor: default;
    }

    .progress {
      margin-top: 20px;
      font-weight: bold;
      text-align: right;
      color: #1a73e8;
    }

    #nextLevelBtn {
      display: none;
      margin: 20px auto;
      padding: 10px 24px;
      font-size: 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #nextLevelBtn:hover {
      background: #155ab6;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">📨 MailSim</div>
    <div class="search-bar">
      <input type="text" placeholder="Αναζήτηση στο inbox...">
    </div>
    <div class="icons">
      <div class="icon">⚙</div>
      <div class="icon">❓</div>
      <div class="icon">👤</div>
    </div>
  </header>

  <div class="container">
    <div id="emailList" class="email-list"></div>
    <div id="emailView" class="email-view"></div>
    <div class="progress" id="progress"></div>
    <button id="nextLevelBtn" onclick="nextLevel()">➡️ Επόμενη Πίστα</button>
  </div>

  <script>
    const levels = [
      {
        phishingCount: 1,
        emails: [
          {
            subject: "Ενημέρωση διαγωνίσματος Μαθηματικών",
            from: "📚 Γραμματεία Σχολείου <info@school.gr>",
            body: "Το διαγώνισμα θα γίνει τη Δευτέρα στην αίθουσα Β1. Καλή επιτυχία!",
            phishing: false
          },
          {
            subject: "Ο λογαριασμός σου θα διαγραφεί!",
            from: "⚠️ Email Support <support@secure.xyz>",
            body: "Συνδέσου άμεσα στο http://fake-login.com για να αποτρέψεις την απενεργοποίηση του email σου.",
            phishing: true
          },
          {
            subject: "Αλλαγή ώρας εκδρομής",
            from: "🚌 Δασκάλα Τμήματος <teacher@school.gr>",
            body: "Η εκδρομή μεταφέρεται για την Παρασκευή λόγω καιρού.",
            phishing: false
          }
        ]
      },
      {
        phishingCount: 2,
        emails: [
          {
            subject: "Δωροεπιταγή 500€ από το Jumbo!",
            from: "🎁 Jumbo Promo <gift@winbig.ru>",
            body: "Συγχαρητήρια! Κέρδισες! Πάτησε εδώ: http://jumbo-freegift.ru",
            phishing: true
          },
          {
            subject: "Αναστολή λογαριασμού email",
            from: "🔒 Διαχειριστής <webadmin@school.net>",
            body: "Στείλε μας το password σου για να ενεργοποιηθεί ξανά ο λογαριασμός σου.",
            phishing: true
          },
          {
            subject: "Συνάντηση Συλλόγου Γονέων",
            from: "👪 Σύλλογος Γονέων <parents@school.gr>",
            body: "Η επόμενη συνάντηση θα γίνει την Παρασκευή στην αίθουσα Α3.",
            phishing: false
          }
        ]
      }
    ];

    let currentLevel = 0;
    let marked = 0;

    function loadLevel() {
      const level = levels[currentLevel];
      marked = 0;
      document.getElementById("nextLevelBtn").style.display = "none";
      document.getElementById("emailList").innerHTML = "";
      document.getElementById("emailView").innerHTML = "";
      updateProgress();

      level.emails.forEach((email, i) => {
        const item = document.createElement("div");
        item.className = "email-item";
        item.innerHTML = `<strong>${email.subject}</strong><span>${email.from}</span>`;
        item.onclick = () => openEmail(email, i);
        document.getElementById("emailList").appendChild(item);
      });
    }

    function openEmail(email, index) {
      const view = document.getElementById("emailView");
      view.classList.add("active");
    
      // Αντικαθιστούμε links με <a href="suspicious.html">
      const safeBody = email.body.replace(/(http[^\\s]+)/g, `<a href="suspicious.html" target="_blank">$1</a>`);
    
      view.innerHTML = `
        <h3>${email.subject}</h3>
        <p><strong>Από:</strong> ${email.from}</p>
        <p>${safeBody}</p>
        <button class="spam-btn" id="mark${index}" onclick="markAsSpam(${index})">🚫 Mark as Spam</button>
      `;
    }


    function markAsSpam(index) {
      const email = levels[currentLevel].emails[index];
      const button = document.getElementById(`mark${index}`);
      if (email.phishing && !button.disabled) {
        marked++;
        button.textContent = "✅ Marked as Spam";
        button.style.backgroundColor = "#34a853";
      } else {
        button.textContent = "❌ Not phishing";
        button.style.backgroundColor = "#999";
      }
      button.disabled = true;
      updateProgress();
    }

    function updateProgress() {
      const level = levels[currentLevel];
      document.getElementById("progress").textContent = `📌 Marked: ${marked}/${level.phishingCount}`;
      if (marked === level.phishingCount) {
        document.getElementById("nextLevelBtn").style.display = "block";
      }
    }

    function nextLevel() {
      currentLevel++;
      if (currentLevel < levels.length) {
        loadLevel();
      } else {
        document.body.innerHTML = `
          <header><h1 style="padding:20px;color:white;background:#1a73e8;">🎉 Μπράβο!</h1></header>
          <div class="container">
            <p>Εντόπισες όλα τα ύποπτα emails!</p>
            <p>Να θυμάσαι πάντα να προσέχεις links και να μην αποκαλύπτεις προσωπικά στοιχεία!</p>
          </div>`;
      }
    }

    window.onload = loadLevel;
  </script>
</body>
</html>
