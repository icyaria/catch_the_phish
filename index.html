<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Προσομοίωση Email Server - Παιχνίδι</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #4285f4;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-weight: bold;
      font-size: 20px;
    }
    .search-bar {
      flex-grow: 1;
      margin: 0 20px;
    }
    .search-bar input {
      width: 100%;
      padding: 6px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
    }
    .icons {
      display: flex;
      gap: 10px;
    }
    .icon {
      background-color: white;
      color: #4285f4;
      padding: 6px;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: default;
    }
    .container {
      max-width: 800px;
      margin: 30px auto;
      background-color: white;
      border-radius: 5px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .email-list {
      border-top: 1px solid #ccc;
    }
    .email-item {
      padding: 12px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    .email-item:hover {
      background-color: #f9f9f9;
    }
    .email-item strong {
      display: block;
    }
    .email-view {
      display: none;
    }
    .email-view.active {
      display: block;
      border-top: 1px solid #ccc;
      margin-top: 20px;
      padding-top: 10px;
    }
    .email-view h3 {
      margin-top: 0;
    }
    .progress {
      text-align: right;
      font-weight: bold;
      margin-top: 15px;
    }
    #nextLevelBtn {
      display: none;
      margin: 20px auto;
      display: block;
      padding: 10px 20px;
      background-color: #34a853;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .spam-btn {
      margin-top: 10px;
      padding: 8px 14px;
      background-color: #ff4d4d;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .spam-btn:disabled {
      background-color: gray;
      cursor: default;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">📧 MailSim</div>
    <div class="search-bar"><input type="text" placeholder="Αναζήτηση μηνυμάτων..."></div>
    <div class="icons">
      <div class="icon">⚙</div>
      <div class="icon">❓</div>
      <div class="icon">👤</div>
    </div>
  </header>

  <div class="container">
    <div id="emailList" class="email-list"></div>
    <div id="emailView" class="email-view"></div>
    <div class="progress" id="progress"></div>
    <button id="nextLevelBtn" onclick="nextLevel()">Επόμενη Πίστα</button>
  </div>

  <script>
    const levels = [
      {
        phishingCount: 1,
        emails: [
          {
            subject: "Ενημέρωση διαγωνίσματος Μαθηματικών",
            from: "γραμματεία@school.gr",
            body: "Το διαγώνισμα θα γίνει τη Δευτέρα στην αίθουσα Β1. Καλή επιτυχία!",
            phishing: false
          },
          {
            subject: "Ο λογαριασμός σου θα διαγραφεί!",
            from: "support@email-center.xyz",
            body: "Συνδέσου άμεσα στο http://fake-secure-login.com για να αποτρέψεις την απενεργοποίηση του email σου!",
            phishing: true
          },
          {
            subject: "Αλλαγή ώρας εκδρομής",
            from: "δασκάλα@school.gr",
            body: "Η εκδρομή μεταφέρεται για την Παρασκευή λόγω καιρού.",
            phishing: false
          }
        ]
      },
      {
        phishingCount: 2,
        emails: [
          {
            subject: "Δωροεπιταγή 500€ από το Jumbo!",
            from: "jumbo-offers@winbig.gr",
            body: "Συγχαρητήρια! Κέρδισες! Κάνε κλικ εδώ για να παραλάβεις: http://jumbo-freegift.ru",
            phishing: true
          },
          {
            subject: "Αναστολή του email λογαριασμού σου",
            from: "webadmin@school.net",
            body: "Στείλε μας τον κωδικό σου για να ενεργοποιηθεί ξανά ο λογαριασμός σου.",
            phishing: true
          },
          {
            subject: "Σύλλογος Γονέων – Νέα Συνάντηση",
            from: "syllogos@school.gr",
            body: "Η επόμενη συνάντηση θα γίνει την Παρασκευή στην αίθουσα Α3.",
            phishing: false
          }
        ]
      }
    ];

    let currentLevel = 0;
    let marked = 0;

    function loadLevel() {
      const level = levels[currentLevel];
      marked = 0;
      document.getElementById("nextLevelBtn").style.display = "none";
      document.getElementById("emailList").innerHTML = "";
      document.getElementById("emailView").innerHTML = "";
      updateProgress();

      level.emails.forEach((email, i) => {
        const item = document.createElement("div");
        item.className = "email-item";
        item.innerHTML = `<strong>${email.subject}</strong><span>Από: ${email.from}</span>`;
        item.onclick = () => openEmail(email, i);
        document.getElementById("emailList").appendChild(item);
      });
    }

    function openEmail(email, index) {
      const view = document.getElementById("emailView");
      view.classList.add("active");
      view.innerHTML = `
        <h3>${email.subject}</h3>
        <p><strong>Από:</strong> ${email.from}</p>
        <p>${email.body}</p>
        <button class="spam-btn" id="mark${index}" onclick="markAsSpam(${index})">Mark as Spam</button>
      `;
    }

    function markAsSpam(index) {
      const email = levels[currentLevel].emails[index];
      const button = document.getElementById(`mark${index}`);
      if (email.phishing && !button.disabled) {
        marked++;
        button.textContent = "Marked ✅";
        button.style.backgroundColor = "#34a853";
      } else {
        button.textContent = "Not phishing";
        button.style.backgroundColor = "gray";
      }
      button.disabled = true;
      updateProgress();
    }

    function updateProgress() {
      const level = levels[currentLevel];
      document.getElementById("progress").textContent = `Marked: ${marked}/${level.phishingCount}`;
      if (marked === level.phishingCount) {
        document.getElementById("nextLevelBtn").style.display = "block";
      }
    }

    function nextLevel() {
      currentLevel++;
      if (currentLevel < levels.length) {
        loadLevel();
      } else {
        document.body.innerHTML = `
          <header><h1>🎉 Τέλος παιχνιδιού!</h1></header>
          <div class="container">
            <p>Συγχαρητήρια! Εντόπισες όλα τα ύποπτα emails.</p>
            <p>Να θυμάσαι: ΠΟΤΕ μην δίνεις κωδικούς ή πατάς σε ύποπτους συνδέσμους.</p>
          </div>`;
      }
    }

    window.onload = loadLevel;
  </script>
</body>
</html>
